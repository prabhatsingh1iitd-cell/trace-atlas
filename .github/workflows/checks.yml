name: Trace Atlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - run: python -m unittest discover -s code/tests -v
      - run: python code/validate.py --output demo
      - run: python code/generate_demo.py --output /tmp/trace-atlas-demo
      - run: diff -r demo /tmp/trace-atlas-demo
      - run: python code/package.py --output demo --destination /tmp/trace-atlas-demo.zip
